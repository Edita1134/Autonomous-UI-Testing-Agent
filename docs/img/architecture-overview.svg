</defs><text x="20" y="32" font-size="18" font-weight="700" fill="#1b1f27">Autonomous UI Test Agent: architecture</text><rect x="20" y="56" width="250" height="410" rx="12" fill="#fafbfc" stroke="#c4cad4" stroke-width="1.2"/><text x="34" y="78" font-size="12.5" font-weight="700" fill="#5b6475" letter-spacing="0.4">1  TRIGGERS</text><rect x="440" y="56" width="520" height="470" rx="12" fill="#fafbfc" stroke="#c4cad4" stroke-width="1.2"/><text x="454" y="78" font-size="12.5" font-weight="700" fill="#5b6475" letter-spacing="0.4">2  AGENT PIPELINE  (agent/)</text><rect x="1000" y="56" width="180" height="470" rx="12" fill="#fafbfc" stroke="#c4cad4" stroke-width="1.2"/><text x="1014" y="78" font-size="12.5" font-weight="700" fill="#5b6475" letter-spacing="0.4">3  EXTERNAL SYSTEMS</text><rect x="440" y="566" width="740" height="110" rx="12" fill="#fafbfc" stroke="#c4cad4" stroke-width="1.2"/><text x="454" y="588" font-size="12.5" font-weight="700" fill="#5b6475" letter-spacing="0.4">4  OUTPUT</text><rect x="50" y="110" width="190" height="54" rx="8" fill="#f1ecfb" stroke="#7a55c9" stroke-width="1.5"/><text x="145.0" y="133.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">GitHub Action</text><text x="145.0" y="150.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">on issue label RFQA</text><rect x="50" y="200" width="190" height="54" rx="8" fill="#f1ecfb" stroke="#7a55c9" stroke-width="1.5"/><text x="145.0" y="223.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Webhook server</text><text x="145.0" y="240.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">on issue label RFQA</text><rect x="50" y="290" width="190" height="54" rx="8" fill="#f1ecfb" stroke="#7a55c9" stroke-width="1.5"/><text x="145.0" y="313.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Dashboard</text><text x="145.0" y="330.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">start a run (React + FastAPI)</text><rect x="50" y="380" width="190" height="54" rx="8" fill="#f1ecfb" stroke="#7a55c9" stroke-width="1.5"/><text x="145.0" y="403.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Command line</text><text x="145.0" y="420.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">python -m agent.main</text><rect x="300" y="240" width="110" height="64" rx="8" fill="#eef0f4" stroke="#5b6475" stroke-width="1.5"/><text x="355.0" y="268.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">agent.main</text><text x="355.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">entry point</text><path d="M 240 137 C 270 137, 270 272, 300 272" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 240 227 C 270 227, 270 272, 300 272" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 240 317 C 270 317, 270 272, 300 272" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 240 407 C 270 407, 270 272, 300 272" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 410 272 H 425 V 183 H 470" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><rect x="470" y="90" width="460" height="56" rx="8" fill="#ffffff" stroke="#7a8599" stroke-width="1.5" stroke-dasharray="5 4"/><text x="700.0" y="105.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Guardrails in code (apply to Executor and Verifier)</text><text x="700.0" y="122.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">8 actions per step  |  loop guard: warn, then abort  |  1 self-heal retry</text><text x="700.0" y="139.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">a verdict's evidence must be found on the page</text><rect x="470" y="160" width="250" height="46" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.5"/><text x="595.0" y="179.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">tickets/</text><text x="595.0" y="196.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">fetch issue, parse Acceptance Criteria</text><rect x="470" y="232" width="250" height="46" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.5"/><text x="595.0" y="251.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Planner</text><text x="595.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">criteria to atomic test steps</text><rect x="662" y="236" width="38" height="16" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1"/><text x="681" y="248" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5300">LLM</text><rect x="470" y="304" width="250" height="46" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.5"/><text x="595.0" y="323.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Executor</text><text x="595.0" y="340.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">observe, think, act (one step at a time)</text><rect x="662" y="308" width="38" height="16" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1"/><text x="681" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5300">LLM</text><rect x="470" y="376" width="250" height="46" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.5"/><text x="595.0" y="395.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Verifier</text><text x="595.0" y="412.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">independent verdict + quoted evidence</text><rect x="662" y="380" width="38" height="16" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1"/><text x="681" y="392" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5300">LLM</text><rect x="470" y="448" width="250" height="46" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.5"/><text x="595.0" y="467.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Reporter</text><text x="595.0" y="484.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">report.md + report.json</text><path d="M 595 206 V 232" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 595 278 V 304" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 595 350 V 376" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><path d="M 595 422 V 448" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><rect x="1020" y="210" width="140" height="96" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1.5"/><text x="1090.0" y="237.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Gemini</text><text x="1090.0" y="254.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">Developer API</text><text x="1090.0" y="271.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">used by Planner,</text><text x="1090.0" y="288.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">Executor, Verifier</text><rect x="1020" y="340" width="140" height="74" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1.5"/><text x="1090.0" y="364.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Playwright</text><text x="1090.0" y="381.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">+ Chromium</text><text x="1090.0" y="398.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">browser/session.py</text><rect x="1020" y="450" width="140" height="60" rx="8" fill="#fff3dc" stroke="#c27a00" stroke-width="1.5"/><text x="1090.0" y="476.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Target web app</text><text x="1090.0" y="493.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">e.g. saucedemo.com</text><path d="M 1090 414 V 450" fill="none" stroke="#4b5565" stroke-width="1.6" marker-start="url(#head-start)" marker-end="url(#head)"/><path d="M 720 321 C 860 321, 900 258, 1020 258" fill="none" stroke="#4b5565" stroke-width="1.6" marker-start="url(#head-start)" marker-end="url(#head)"/><text x="870" y="262" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6475">prompts + tool calls</text><path d="M 720 337 C 860 337, 900 377, 1020 377" fill="none" stroke="#4b5565" stroke-width="1.6" marker-start="url(#head-start)" marker-end="url(#head)"/><text x="870" y="404" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6475">actions + ARIA snapshot</text><rect x="470" y="598" width="230" height="52" rx="8" fill="#e3f4e9" stroke="#137a3f" stroke-width="1.5"/><text x="585.0" y="620.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">GitHub issue</text><text x="585.0" y="637.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">comment + qa-* label</text><rect x="730" y="598" width="230" height="52" rx="8" fill="#e3f4e9" stroke="#137a3f" stroke-width="1.5"/><text x="845.0" y="620.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">evidence/run-id/</text><text x="845.0" y="637.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">log, screenshots, video, report</text><rect x="990" y="598" width="170" height="52" rx="8" fill="#e3f4e9" stroke="#137a3f" stroke-width="1.5"/><text x="1075.0" y="620.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1f27">Dashboard</text><text x="1075.0" y="637.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b1f27">live log + results</text><path d="M 585 494 V 598" fill="none" stroke="#4b5565" stroke-width="1.6" marker-end="url(#head)"/><text x="593" y="560" text-anchor="start" font-size="11" font-style="italic" fill="#5b6475">posts result</text><pa