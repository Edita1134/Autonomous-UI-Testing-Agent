name: RFQA agent

# Runs the autonomous UI test agent when an issue gets the "RFQA" label.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to test"
        required: true
        default: "1"

permissions:
  issues: write
  contents: read

jobs:
  test-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'RFQA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ensure QA result labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create qa-passed --description "Autonomous UI test passed" --color 0E8A16 --force
          gh label create qa-failed --description "Autonomous UI test failed" --color D93F0B --force
          gh label create qa-blocked --description "Autonomous UI test blocked or inconclusive" --color FBCA04 --force
      - name: Run agent
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi
          python -m agent.main --issue "$ISSUE_NUMBER" --post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence/
