name: Tests

# Runs the unit and pipeline tests on every push and pull request. No API key or browser is needed.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: pip install -r agent-dashboard/requirements.txt
      - run: pytest -q
      - run: pytest -q agent-dashboard/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-dashboard/frontend/package-lock.json

      - run: npm ci
        working-directory: agent-dashboard/frontend
      - run: npm run build
        working-directory: agent-dashboard/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: agent-dashboard/frontend

      - name: Start dashboard
        working-directory: agent-dashboard
        run: uvicorn dashboard.app:app --host 127.0.0.1 --port 8765 &

      - run: npm run test:ui
        working-directory: agent-dashboard/frontend
        env:
          UI_BASE_URL: http://127.0.0.1:8765
